<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRIME-MD • Pair Your Session</title>
<style>
  :root {
    --bg-1: #0b0f19;
    --bg-2: #121826;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --text: #eef1f7;
    --muted: #8a91a8;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --success: #34d399;
    --error: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1b1440 0%, var(--bg-1) 45%),
                radial-gradient(circle at 80% 80%, #062a33 0%, var(--bg-1) 50%),
                var(--bg-1);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand h1 {
    margin: 0;
    font-size: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.5px;
  }
  .brand p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .tabs {
    display: flex;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.2s ease;
    user-select: none;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0f19;
  }
  .panel { display: none; }
  .panel.active { display: block; }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:disabled { opacity: 0.5; }

  button.primary {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0f19;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button.primary:hover:not(:disabled) { transform: translateY(-1px); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .status-box {
    margin-top: 20px;
    text-align: center;
  }
  .qr-wrap {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }
  .qr-wrap img {
    width: 220px;
    height: 220px;
    border-radius: 14px;
    background: white;
    padding: 10px;
  }
  .pulse {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    margin-right: 8px;
    animation: pulse 1.2s infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,211,238,0.6); }
    70% { box-shadow: 0 0 0 10px rgba(34,211,238,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
  }
  .code-display {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: 700;
    color: var(--accent-2);
    margin: 16px 0 4px;
    user-select: all;
  }
  .msg { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .msg.error { color: var(--error); }
  .msg.warn { color: var(--warn); }
  .msg.success { color: var(--success); }

  /* Error/warning banner that stacks ABOVE the persisted code/QR instead
     of replacing it, so a transient disconnect doesn't wipe a code the
     user could still copy and use. */
  .banner {
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    text-align: left;
  }
  .banner.error { background: rgba(248,113,113,0.12); color: var(--error); border: 1px solid rgba(248,113,113,0.3); }
  .banner.warn { background: rgba(251,191,36,0.12); color: var(--warn); border: 1px solid rgba(251,191,36,0.3); }

  .session-box {
    margin-top: 16px;
    text-align: left;
  }
  textarea {
    width: 100%;
    height: 100px;
    resize: none;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.3);
    color: var(--success);
    font-family: monospace;
    font-size: 11px;
    padding: 10px;
    margin-top: 8px;
  }
  .copy-btn, .reset-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  .copy-btn:hover, .reset-btn:hover { background: rgba(255,255,255,0.09); }
  .copy-btn.copied { border-color: var(--success); color: var(--success); }
  .warn-text {
    font-size: 12px;
    color: var(--error);
    margin-top: 10px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <h1>PRIME-MD</h1>
    <p>Link your WhatsApp to generate a session</p>
  </div>

  <div class="tabs">
    <a class="tab" id="tabQr" href="#">QR Code</a>
    <a class="tab" id="tabCode" href="#">Pairing Code</a>
  </div>

  <div class="panel" id="panel-qr">
    <button class="primary" id="startQrBtn">Generate QR Code</button>
    <div class="status-box" id="qrStatus"></div>
  </div>

  <div class="panel" id="panel-code">
    <input type="text" id="phoneInput" placeholder="e.g. 254712345678 (with country code)" />
    <button class="primary" id="startCodeBtn">Get Pairing Code</button>
    <div class="status-box" id="codeStatus"></div>
  </div>
</div>
